name: daily-shop-watch

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m shopwatch
      - name: Merge official catalog when available for the same shop date
        run: |
          SNAP=data/shop-latest.json
          OFFICIAL=data/official-latest.json
          if [ -f "$OFFICIAL" ] && python -m shopwatch.official "$SNAP" "$OFFICIAL" --check-date; then
            python -m shopwatch.official "$SNAP" "$OFFICIAL" --out "$SNAP"
          else
            echo "official catalog missing or different shop date, skipping"
          fi
      - name: Open PR with snapshot and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no changes"
            exit 0
          fi
          SHOP_DATE=$(jq -r '.date' data/shop-latest.json | cut -c1-10)
          BRANCH="shop-update/${SHOP_DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data reports
          git commit -m "Shop update ${SHOP_DATE}"
          git push -u origin "$BRANCH" --force
          set +e
          PR_OUT=$(gh pr create --base main --head "$BRANCH" --title "Shop update ${SHOP_DATE}" --body-file "reports/${SHOP_DATE}.md" 2>&1)
          PR_EXIT=$?
          set -e
          if [ $PR_EXIT -eq 0 ]; then
            echo "pull request opened"
          elif printf '%s' "$PR_OUT" | grep -qi "already exists"; then
            echo "pull request already exists, skipping"
          else
            printf '%s\n' "$PR_OUT"
            exit 1
          fi
