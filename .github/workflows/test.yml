name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  pdf-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python scripts/render_pdf_fixture.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: pdf-preview
          path: pdf-preview.pdf

  official-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reconcile official catalog when this PR carries a same-date capture
        run: |
          SNAP=data/shop-latest.json
          OFFICIAL=data/official-latest.json
          if [ -f "$SNAP" ] && [ -f "$OFFICIAL" ] && python -m shopwatch.official "$SNAP" "$OFFICIAL" --check-date; then
            python -m shopwatch.official "$SNAP" "$OFFICIAL" --out "$RUNNER_TEMP/shop-merged.json" --fail-on-price-mismatch
          else
            echo "no same-date official catalog in this PR, reconcile gate skipped"
          fi
      - name: Upload official reconcile sidecar
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-reconcile-report
          path: ${{ runner.temp }}/shop-merged.json.official-report.json
          if-no-files-found: ignore
